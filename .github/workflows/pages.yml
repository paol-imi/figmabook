name: Pages

# Builds the documentation site (docs/, W-01) and deploys it to GitHub Pages.
# Pull requests only build it, which also fails on dead links.
# Deploying is inert until the owner enables Pages: Settings ▸ Pages ▸ Build and deployment ▸
# Source: GitHub Actions. Until then the build still runs and the deploy job is skipped.
# "Run workflow" and push runs need this file on the default branch (main).
# Setup steps: docs/README.md, "Deploying to GitHub Pages".
# Published Pages are public on the internet, even from a private repository.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - docs/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its running build; main builds always finish.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.pages.outputs.enabled == 'true' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      # Uses the pnpm version pinned in package.json `packageManager`.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Only the site's dependencies: it does not import any workspace package.
      - name: Install
        run: pnpm install --frozen-lockfile --filter @holotype/docs

      # Deploy only when Pages is enabled with "GitHub Actions" as its source. Choosing that
      # source in Settings > Pages creates the Pages site, so the first deploy needs no earlier
      # one. "Not enabled" (HTTP 404, or another source) skips the deploy; any other API error
      # fails the run, so a broken check never skips deploys silently.
      - name: Check GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2> "$RUNNER_TEMP/pages-error")"; then
            :
          elif grep -q "HTTP 404" "$RUNNER_TEMP/pages-error"; then
            build_type=""
          else
            cat "$RUNNER_TEMP/pages-error" >&2
            echo "::error title=Pages check failed::Could not read the GitHub Pages settings of ${GITHUB_REPOSITORY}."
            exit 1
          fi
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            # A manual run asked for a deploy, so say it louder than on a push.
            level=notice
            if [ "$EVENT" = "workflow_dispatch" ]; then level=warning; fi
            case "$build_type" in
              "") reason="Pages is off" ;;
              legacy) reason="the source is Deploy from a branch" ;;
              *) reason="the source is ${build_type}" ;;
            esac
            echo "::${level} title=Site not deployed::GitHub Pages is not enabled for GitHub Actions (${reason}). To publish the site, open Settings > Pages > Build and deployment and set Source to GitHub Actions, then run this workflow again."
          fi

      - name: Configure Pages
        id: configure
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      # The base path follows the Pages settings (project path or custom domain).
      # Without Pages, the site's default base (/figmabook/) is used.
      - name: Build
        run: pnpm -F @holotype/docs build
        env:
          HOLOTYPE_SITE_BASE: ${{ steps.pages.outputs.enabled == 'true' && format('{0}/', steps.configure.outputs.base_path) || '' }}

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; never cancel one that has started.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
