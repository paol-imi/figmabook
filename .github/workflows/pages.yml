name: Pages

# Builds the documentation site (website/, W-01) and deploys it to GitHub Pages.
# Pull requests only build it, which also fails on dead links.
# Deploying is inert until the owner enables Pages: Settings ▸ Pages ▸ Source: GitHub Actions.
# Until then the build still runs and the deploy job is skipped, so nothing fails.
# Published Pages are public on the internet, even from a private repository.

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/diagnostics/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - website/**
      - docs/diagnostics/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its running build; main builds always finish.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.pages.outputs.enabled == 'true' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      # Uses the pnpm version pinned in package.json `packageManager`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Only the site's dependencies: it does not import any workspace package.
      - name: Install
        run: pnpm install --frozen-lockfile --filter @holotype/website

      # Deploy only when Pages is enabled with "GitHub Actions" as its source.
      - name: Check GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || true)"
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Site not deployed::GitHub Pages is not enabled for GitHub Actions. To publish the site, open Settings > Pages and set Source to GitHub Actions."
          fi

      - name: Configure Pages
        id: configure
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      # The base path follows the Pages settings (project path or custom domain).
      # Without Pages, the site's default base (/figmabook/) is used.
      - name: Build
        run: pnpm -F @holotype/website build
        env:
          HOLOTYPE_SITE_BASE: ${{ steps.pages.outputs.enabled == 'true' && format('{0}/', steps.configure.outputs.base_path) || '' }}

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; never cancel one that has started.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
